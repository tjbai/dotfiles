# gruvbox dark — ported from sentinel/ui/src/index.css (.dark)
name = "gruvbox"
mode = "dark"

[colors]
background = "#282828"
foreground = "#ebdbb2"
primary = "#83a598"
secondary = "#d3869b"
accent = "#8ec07c"
success = "#b8bb26"
warning = "#fabd2f"
info = "#83a598"
destructive = "#fb4934"

[ui]
muted_foreground = "#a89984"
border = "#504945"
cursor = "#ebdbb2"
selection = "#3c3836"

[syntax]
keyword = "#fb4934"
string = "#b8bb26"
number = "#d3869b"
comment = "#928374"
function = "#83a598"
variable = "#ebdbb2"
type = "#fabd2f"
operator = "#fe8019"
