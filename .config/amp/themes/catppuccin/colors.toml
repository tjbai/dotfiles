# catppuccin mocha — ported from sentinel/ui/src/index.css (.catppuccin)
name = "catppuccin"
mode = "dark"

[colors]
background = "#1e1e2e"
foreground = "#cdd6f4"
primary = "#89b4fa"
secondary = "#cba6f7"
accent = "#89dceb"
success = "#a6e3a1"
warning = "#f9e2af"
info = "#89dceb"
destructive = "#f38ba8"

[ui]
muted_foreground = "#9399b2"
border = "#45475a"
cursor = "#f5e0dc"
selection = "#313244"

[syntax]
keyword = "#cba6f7"
string = "#a6e3a1"
number = "#fab387"
comment = "#6c7086"
function = "#89b4fa"
variable = "#cdd6f4"
type = "#f9e2af"
operator = "#89dceb"
