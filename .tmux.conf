# ── core ──────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-features ",xterm-ghostty:RGB"
set -g mouse on
set -g history-limit 50000
set -sg escape-time 10
set -g base-index 1
set -wg pane-base-index 1
set -g renumber-windows on

# splits/windows open in the current pane's directory
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display "reloaded"

# ── amp cli compatibility ─────────────────────────────────────────────
set -g allow-passthrough all
set -g focus-events on
set -ga terminal-features ",*:hyperlinks"
set -s set-clipboard on
set -s extended-keys on
# shift+enter as CSI-u (ESC [13;2u) for amp; hex form — tmux config quoting
# mangles "\x1b" into a literal x1b
bind -n S-Enter send-keys -H 1b 5b 31 33 3b 32 75

# ── attention ─────────────────────────────────────────────────────────
# bell = something needs me: pass it through to ghostty, which marks the
# tab (bell-features attention/title). works even from background windows.
set -g bell-action any
set -g visual-bell off
set -wg monitor-bell on
# activity = output since i last looked: status-line flag only, no bell
# (agents stream constantly — a bell per write would be noise).
set -wg monitor-activity on
set -g activity-action none
set -g visual-activity off

# ghostty tab title: session name + whatever the fg program sets (#T)
set -g set-titles on
set -g set-titles-string "#{?window_bell_flag,🔔 ,}#S · #T"

# status line: session left, windows flagged 🔔 bell / ● activity
set -g status-style "bg=default,fg=colour245"
set -g status-left "#[bold,fg=colour214]#S #[default]· "
set -g status-left-length 30
set -g status-right ""
set -wg window-status-format " #I:#W#{?window_bell_flag,🔔,#{?window_activity_flag,●,}} "
set -wg window-status-current-format "#[bold,fg=colour223] #I:#W#{?window_bell_flag,🔔,} "
set -wg window-status-bell-style "fg=colour167,bold"
set -wg window-status-activity-style "fg=colour214"

# ── durability across reboots ─────────────────────────────────────────
# tmux-resurrect: prefix+ctrl-s save / prefix+ctrl-r restore (layout+cwd).
# tmux-continuum: autosaves every 10 min, auto-restores on server start.
# running agents don't survive a reboot — resume them per-pane
# (`amp threads continue`); the layout and cwds come back on their own.
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-save-interval '10'
set -g @continuum-restore 'on'
if-shell "test -d ~/.tmux/plugins/tmux-resurrect" "run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux"
if-shell "test -d ~/.tmux/plugins/tmux-continuum" "run-shell ~/.tmux/plugins/tmux-continuum/continuum.tmux"
